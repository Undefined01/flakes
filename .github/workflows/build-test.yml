name: Build Test

on:
  push: {}
  pull_request:
    branches:
    - main
    - dev
  workflow_dispatch: {}

jobs:
  define-matrix:
    runs-on: ubuntu-latest

    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Define Configuration Matrix
        id: jobs
        shell: nix shell nixpkgs#{jq} --run "bash"
        run: |
          set -euo pipefail

          linux_configs="$(nix eval --json .#. --apply 'outputs: outputs.nixosConfigurations |> builtins.attrNames')"
          darwin_configs="$(nix eval --json .#. --apply 'outputs: outputs.darwinConfigurations |> builtins.attrNames')"

          jobs="$(jq -cn \
            --argjson linux "$linux_configs" \
            --argjson darwin "$darwin_configs" \
            '{
              include:
                ([ $linux[] | { runner: "ubuntu-latest", system: "x86_64-linux", config: "nixosConfigurations." + . } ] +
                 [ $darwin[] | { runner: "macos-latest", system: "aarch64-darwin", config: "darwinConfigurations." + . } ])
            }'
          )"

          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  packages:
    name: Built Common Packages
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          config: x86_64-linux.packages
        - runner: macos-latest
          config: aarch64-darwin.packages
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators

    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        name: undefined01
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        extraPullNames: nix-community

    - name: Build Common Packages for ${{ matrix.config }}
      run: |
        nix config show
        df -h
        free -h || memory_pressure
        nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --max-jobs 1 --eval-workers 1 --no-link --flake .#checks.${{ matrix.config }}

  configurations:
    name: Build Configurations
    needs:
      - define-matrix
      - packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.jobs) }}
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators

    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        name: undefined01
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        extraPullNames: nix-community

    - name: Build ${{ matrix.config }}
      run: |
        nix config show
        df -h
        free -h || memory_pressure
        nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --max-jobs 1 --eval-workers 1 --no-link --file .github/workflows/system-packages.nix

  check-flake:
    name: Check Flake
    runs-on: ubuntu-latest
    if: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators

    - name: Check flake
      run: |
        nix flake check --no-build --all-systems

    - name: Show flake info
      run: |
        nix flake show

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators

    - name: Check formatting
      run: |
        nix fmt -- --ci .
